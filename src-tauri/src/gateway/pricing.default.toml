# KALYPSO model prices, in US dollars per million tokens.
#
# The gateway re-reads this file when it changes. Edit a price or add a model;
# requests to models that are not listed are still counted, but marked unpriced.
#
#   input, output    required
#   cache_write      5-minute cache writes   (default 1.25 x input)
#   cache_write_1h   1-hour cache writes     (default 2 x input)
#   cache_read       cache hits              (default 0.1 x input)
#   long_context     { above = <prompt tokens>, input = .., output = .. }
#                    rates once a prompt is longer than `above`; cache rates
#                    scale by the same factor as input.
#
# A name ending in * matches every model that starts with it; the longest match wins.
# Anthropic first-party list prices, checked 2026-10-29. Verify against
# https://platform.claude.com/docs/en/about-claude/pricing before relying on them.

[models."claude-fable-5-1"]
input = 10.0
output = 50.0
cache_read = 0.25

[models."claude-fable-5"]
input = 10.0
output = 50.0

[models."claude-opus-5-5"]
input = 4.0
output = 20.0
cache_read = 0.20

[models."claude-opus-5"]
input = 5.0
output = 25.0

[models."claude-opus-4*"]
input = 5.0
output = 25.0

[models."claude-sonnet-5-5"]
input = 2.0
output = 10.0
cache_read = 0.20

[models."claude-sonnet-5"]
input = 2.0
output = 10.0

[models."claude-sonnet-4-6"]
input = 3.0
output = 15.0

[models."claude-haiku-5-5"]
input = 0.10
output = 0.50
long_context = { above = 100000, input = 0.50, output = 2.50 }

[models."claude-haiku-4-5"]
input = 1.0
output = 5.0

# OpenAI-compatible providers: add the models you use, for example
#
# [models."gpt-4.1"]
# input = 2.0
# output = 8.0
# cache_read = 0.5
#
# Local models (Ollama, vLLM) cost nothing per token:
#
# [models."llama*"]
# input = 0.0
# output = 0.0
