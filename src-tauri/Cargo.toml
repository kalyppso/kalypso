[package]
name = "kalypso"
version = "0.1.0"
edition = "2021"

[lib]
name = "kalypso_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tokio = { version = "1.54.1", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
futures-util = "0.3.34"
ts-rs = "12.0.1"
rand = "0.8"
chacha20poly1305 = "0.10"
bollard = "0.18"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "apple-native", "windows-native"] }
tracing-appender = "0.2"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
toml = "0.8"
sha2 = "0.10"
bytes = "1"
tauri-plugin-notification = "2"
regex = "1"
globset = "0.4"
base64 = "0.22"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri = { version = "2", features = ["test"] }
tempfile = "3.27.0"
