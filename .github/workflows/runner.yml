name: Agent runner image

# Publishes ghcr.io/kalyppso/agent-runner, the sandbox image Claude Agent SDK agents
# run in. CI builds and tests it on every pull request (see ci.yml); this pushes it.
on:
  push:
    branches: [main]
    paths: ["runner/agent-sdk/**", ".github/workflows/runner.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          tags="ghcr.io/kalyppso/agent-runner:latest,ghcr.io/kalyppso/agent-runner:sha-${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then tags="$tags,ghcr.io/kalyppso/agent-runner:${GITHUB_REF_NAME#v}"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: runner/agent-sdk
          file: runner/agent-sdk/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
